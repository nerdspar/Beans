# Beans — the whole stack, for the TrueNAS Apps UI (Install via YAML / Custom App).
#
# This is the file to use. `truenas-db.yaml` remains for the database-only arrangement that predates
# it; running both at once would be actively dangerous — see "Migrating" below.
#
# Why one file rather than two:
#
#   - Postgres does not need to be on the LAN at all. The app reaches it by service name over the
#     compose network, so no port is published and nothing outside this stack can connect. That is
#     strictly better than publishing 5432 and relying on nobody proxying it.
#   - The same now goes for the app itself. `cloudflared` is in this file so it can reach `app:3100`
#     over that network, which means the app publishes no port either and the tunnel is the only way
#     in. Split across two stacks, the app would have to be on the LAN for the tunnel to find it —
#     which is the exposure the tunnel exists to remove.
#   - The API applies migrations on startup, so it genuinely needs the database ready first.
#     `depends_on` with `service_healthy` expresses that; two separate apps cannot.
#
# TrueNAS runs custom-app YAML from its own managed project directory, so there is no `.env`
# alongside it: `${VAR}` resolves to empty and `build:` is unsupported. Everything here is literal
# and image-only. The root `docker-compose.yml` stays canonical for local development.
#
# ---------------------------------------------------------------------------------------------
# Before first start
#
#   1. The application image must exist. Push to `main` and let the Image workflow publish it, or
#      build it on the NAS with `docker build -f docker/Dockerfile -t ghcr.io/nerdspar/beans:latest .`
#
#   2. /mnt/NAS/Data/beans/initdb/01-init.sh must already be on disk. It runs exactly once, on an
#      empty data directory, and creates the non-superuser application role.
#
#   3. The master key must exist, be valid JSON, and be readable by uid 568.
#
#      **Generate a new one ONLY for an empty database. Otherwise copy the existing key.**
#
#      The master key is not a per-deployment secret; it belongs to the data. Every household's data
#      key is stored wrapped by it, so a database that already holds households can only be opened by
#      the key that wrapped them. Pointing a new deployment at an existing database with a fresh key
#      fails on the first read with:
#
#          Decryption failed: authentication failed
#
#      which is AES-GCM refusing a wrong key rather than anything being corrupt. Nothing is damaged;
#      the right key simply is not present. Note the version does not catch this — a fresh key is
#      also version 1, so the lookup succeeds and only the authentication tag disagrees.
#
#      If this deployment points at the database used in development — which it does, if it mounts
#      the same data directory — then copy that key rather than generating one:
#
#          scp secrets/master.key <nas>:/mnt/NAS/Data/beans/secrets/master.key
#
#      **It is a JSON document, not a bare base64 string** — the shape carries a version so the key
#      can be rotated without downtime (ARCHITECTURE.md §5), and the loader rejects anything else at
#      boot. `{"currentVersion":1,"keys":{"1":"<32 bytes, base64>"}}`
#
#      For a genuinely empty database, generate one (`pnpm generate:master-key` does the same thing):
#
#        mkdir -p /mnt/NAS/Data/beans/secrets
#        printf '{"currentVersion":1,"keys":{"1":"%s"}}\n' "$(head -c 32 /dev/urandom | base64)" \
#          > /mnt/NAS/Data/beans/secrets/master.key
#        chown -R 568:568 /mnt/NAS/Data/beans/secrets
#        chmod 600 /mnt/NAS/Data/beans/secrets/master.key
#
#      Verify it before starting anything — `pnpm --filter @beans/api dev:check-key <path>` runs the
#      same loader the server uses at boot.
#
#      **Create the file before the first start.** Docker bind-mounts a path that does not exist by
#      creating an empty *directory* at it, and the container then fails with "Cannot read master key
#      file" — which reads like a permissions problem and is not one. If that has already happened:
#        rm -rf /mnt/NAS/Data/beans/secrets/master.key   # it is a directory, not a file
#      then write the file and recreate the app.
#
#      **Back this up somewhere other than the database.** It wraps every household's data key, so a
#      database backup without it is unreadable ciphertext — and the two stored together defeat the
#      point of wrapping the keys at all (ARCHITECTURE.md §5).
#
#   4. Replace every REPLACE_ value below.
#
#   5. Create the Cloudflare tunnel and paste its token below.
#
#      In the Zero Trust dashboard: Networks -> Tunnels -> Create a tunnel -> Cloudflared. Name it,
#      copy the token from the Docker install snippet, and add one public hostname:
#
#          beans.nerdspar.com  ->  HTTP  ->  app:3100
#
#      `app:3100` is the service name on this compose network, not an IP and not localhost. The
#      tunnel container resolves it the same way the app resolves `db`.
#
#      **HTTP, not HTTPS, is correct for the service URL.** TLS terminates at Cloudflare and the
#      last hop runs inside the compose network, which never touches the LAN. Setting HTTPS there
#      means presenting a certificate the app does not have, and the tunnel fails to connect.
#
#      Cloudflare creates the DNS record itself when you add the hostname. Nothing is forwarded on
#      the router — the tunnel dials out, so there is no inbound port to open and no public IP to
#      find. That is the whole reason to prefer it to a reverse proxy on a home connection.
#
#      HTTPS remains non-optional and Cloudflare provides it: the session cookie is Secure, Google
#      rejects OAuth redirects to bare IPs, and a service worker needs a secure context to install.
#
#      The token is a credential — it grants routing into this network. It is inline here, like the
#      database password and the auth secret, because TrueNAS gives custom apps no `.env`. Unlike
#      the master key it is not tied to the data: revoke and reissue it from the dashboard whenever
#      you like, at the cost of one restart. It is worth nothing to an attacker without it.
#
# ---------------------------------------------------------------------------------------------
# Migrating from the database-only app
#
# The existing database app already binds host port 5432 and owns /mnt/NAS/Data/beans/db. **Stop and
# delete it before starting this stack.** Two Postgres containers pointing at one data directory is
# not a port conflict, it is corruption — the second refuses to start if it sees the first's lock
# file, and does something worse if it does not.
#
# Your data is safe across the move. It lives in the bind mount, not in the container, and Postgres
# runs initdb only on an empty directory — so this stack adopts the existing database rather than
# reinitializing it, and 01-init.sh will not run a second time.

services:
  db:
    image: postgres:16
    restart: unless-stopped

    # Pinned to the postgres user's own uid, with the host directory chowned to match:
    #     chown -R 999:999 /mnt/NAS/Data/beans/db
    #
    # The entrypoint normally starts as root, creates PGDATA, chowns it, then drops to postgres via
    # gosu. TrueNAS Apps runs custom apps as its `apps` user (568), so that root step never happens
    # and the entrypoint fails with:
    #     mkdir: cannot create directory '/var/lib/postgresql/data': Permission denied
    # Pinning the uid removes the dependency on that step entirely.
    user: '999:999'

    # Postgres uses shared memory for parallel query and sorts. Docker's 64mb default is tight.
    shm_size: 256mb

    environment:
      # The superuser. The application deliberately does NOT connect as this role — superusers
      # bypass row-level security entirely, which would silently disable tenant isolation.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REPLACE_SUPERUSER_PASSWORD
      POSTGRES_DB: beans

      # A subdirectory, not the mount root. A bind-mounted ZFS dataset is never truly empty and
      # initdb refuses to initialize a non-empty directory.
      PGDATA: /var/lib/postgresql/data/pgdata

      # Read by initdb/01-init.sh.
      BEANS_DB_USER: beans_app
      BEANS_DB_PASSWORD: REPLACE_APP_PASSWORD
      BEANS_DB_NAME: beans
      BEANS_TEST_DB_NAME: beans_test

    # No `ports`. The app reaches this over the compose network by service name, so the database is
    # not on the LAN at all. To run psql against it:
    #     docker compose exec db psql -U postgres -d beans
    # Publish 5432 only if you need an external client, and never through the reverse proxy.

    volumes:
      - /mnt/NAS/Data/beans/db:/var/lib/postgresql/data
      - /mnt/NAS/Data/beans/initdb:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d beans']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: ghcr.io/nerdspar/beans:latest
    restart: unless-stopped

    # Matches the TrueNAS `apps` user, which owns the secrets directory. The image runs as `node`
    # by default; overriding here keeps host file ownership simple.
    user: '568:568'

    depends_on:
      db:
        # Not merely `started`. The API applies migrations on boot, and against a Postgres that is
        # accepting connections but still recovering, that fails the whole container.
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: '3100'
      LOG_LEVEL: info

      # `db` is the service name on the compose network. The application role is non-superuser and
      # non-BYPASSRLS; connecting as the superuser would silently disable row-level security and
      # therefore tenant isolation entirely.
      DATABASE_URL: postgres://beans_app:REPLACE_APP_PASSWORD@db:5432/beans

      # Referenced by path, never inlined. An environment variable holding the key would put it in
      # `docker inspect`, in the TrueNAS UI, and in any process listing.
      MASTER_KEY_FILE: /run/secrets/master.key

      # One origin serves both the API and the app, which is why no CORS and no extra trusted
      # origins are needed here. Must match the certificate exactly.
      PUBLIC_URL: https://beans.nerdspar.com
      BETTER_AUTH_URL: https://beans.nerdspar.com
      BETTER_AUTH_SECRET: REPLACE_AUTH_SECRET

      # Empty in production on purpose: the frontend is served from PUBLIC_URL, so there is no
      # second origin. This list is the CSRF boundary — do not add to it to work around a problem.
      EXTRA_TRUSTED_ORIGINS: ''

      # Optional. Leave both empty and the Google button is hidden rather than rendered broken.
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''

      # Optional. With mail unconfigured, invites still work — the link is shown on screen to copy.
      RESEND_API_KEY: ''
      MAIL_FROM: beans@nerdspar.com

      # The client's real address, for sign-in rate limiting. Cloudflare always writes this header
      # and always overwrites it, so unlike `x-forwarded-for` it cannot arrive as a chain and cannot
      # be forged.
      #
      # **That holds only while the port below stays unpublished.** Anything that can reach the
      # container directly can claim to be any address by setting the header itself — there is no
      # tunnel in the way to overwrite it. These are one decision; do not undo half of it.
      TRUSTED_IP_HEADER: cf-connecting-ip

    # No `ports`, for the same reason the database has none: cloudflared reaches this over the
    # compose network by service name, so the app is not on the LAN at all and nothing is forwarded
    # on the router. The only way in is the tunnel, which is the point.
    #
    # To reach it from the NAS itself without opening it up — checking whether a problem is the app
    # or the tunnel:
    #     docker compose exec app node -e "require('http').get('http://127.0.0.1:3100/health',
    #       r => r.pipe(process.stdout))"
    #
    # If you go back to a reverse proxy, publish '3100:3100' again **and** change TRUSTED_IP_HEADER
    # back to x-forwarded-for in the same edit.

    volumes:
      - /mnt/NAS/Data/beans/secrets/master.key:/run/secrets/master.key:ro

    healthcheck:
      # Checks the database and the sync worker, not merely that Node is alive. A stopped worker
      # returns 503: balances quietly stop updating while every request still succeeds, which is
      # exactly the failure that must not read as healthy.
      # Single quotes inside double quotes, so nothing needs escaping through YAML or the shell.
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:3100/health',
          r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # The only route in from the internet.
  #
  # It dials out to Cloudflare and holds the connection open, so traffic arrives over a socket this
  # container opened. There is no listening port, nothing forwarded on the router, and the NAS's
  # address is never published — which is the substantive difference from a reverse proxy, not just
  # a more convenient way to get a certificate.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped

    # `service_started`, deliberately not `service_healthy`.
    #
    # The app reports unhealthy when the sync worker is stopped, on purpose — balances silently
    # going stale must not read as fine. But that is a reason to show degraded data, not a reason to
    # be unreachable. Gate the tunnel on healthy and a stack restart while the worker is failing
    # leaves the whole site off the internet, with no way to sign in and see why.
    #
    # The cost is a short window during migrations where Cloudflare answers 502 because nothing is
    # listening yet. That is the better failure: it is brief, and it self-resolves.
    depends_on:
      - app

    # `run` with no tunnel name: the token names the tunnel, carries its credentials, and holds the
    # hostname routing configured in the dashboard.
    #
    # Do not add `--no-autoupdate` here even though every guide shows it. The image's ENTRYPOINT is
    # already `cloudflared --no-autoupdate`, so this appends to it — the flag is present, and
    # repeating it after the subcommand risks the parser rejecting it outright.
    command: tunnel run

    environment:
      # By environment rather than on the command line, so it is not in `ps` inside the container.
      # Both are visible to `docker inspect`, which is the same exposure the database password and
      # the auth secret already have — and unlike the master key this token is not tied to any data.
      # Revoke and reissue it from the dashboard at any time; the cost is one restart.
      #
      # For tighter handling, cloudflared also reads TUNNEL_TOKEN_FILE. Mounting it needs care: this
      # image runs as uid 65532, so it cannot read a 600 file owned by 568 the way the master key is
      # — set `user: '568:568'` on this service as well if you go that way.
      TUNNEL_TOKEN: REPLACE_CLOUDFLARE_TUNNEL_TOKEN

    # No healthcheck, and not an oversight. cloudflared can expose a /ready probe on a metrics port,
    # but the image is distroless — no shell, no wget, no curl — so there is nothing here to call it
    # with, and a CMD-SHELL probe would fail every time and cycle a tunnel that was working.
    # `docker logs cloudflared` and the dashboard's own tunnel status both report the connection.
