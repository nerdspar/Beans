name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest

    # Integration tests need a real Postgres — never a mock, never SQLite (ARCHITECTURE.md §14).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beans
          POSTGRES_PASSWORD: beans
          POSTGRES_DB: beans_test
        options: >-
          --health-cmd "pg_isready -U beans"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Apply migrations to the test database
        run: pnpm --filter @beans/api db:migrate:test
        env:
          TEST_DATABASE_URL: postgres://beans:beans@localhost:5432/beans_test

      - name: Test
        run: pnpm test
        env:
          # Present, so integration tests run rather than skipping. A suite that silently skips its
          # most important tests — the cross-tenant isolation ones — is worse than a failing one.
          TEST_DATABASE_URL: postgres://beans:beans@localhost:5432/beans_test
