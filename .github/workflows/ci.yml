name: CI

on:
  push:
    branches: [main]
    # Tags build too, and they are the only thing that builds arm64 — see `platforms` below.
    # `metadata-action` already had a `type=ref,event=tag` rule, which until now could never fire
    # because nothing here triggered on one.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest

    # This job runs in about four minutes. Ten is generous and still catches a hung integration
    # test — the suite shares one database and pins to a single worker, so a deadlock there stalls
    # rather than fails. GitHub's default is six hours, which is not a limit, it is a bill.
    timeout-minutes: 10

    # Integration tests run against a real Postgres — never a mock, never SQLite (ARCHITECTURE.md §14).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beans
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      # The same script the production database is initialized with, rather than a copy of its SQL.
      # What it creates is the point: a NOSUPERUSER, NOBYPASSRLS role. Postgres silently ignores
      # row-level security for superusers, so running the suite as the POSTGRES_USER would make every
      # cross-tenant isolation test meaningless — the most important tests here, passing for the
      # wrong reason or failing for a reason that has nothing to do with the code.
      - name: Create the application role and test database
        run: bash docker/initdb/01-init.sh
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: beans
          BEANS_DB_USER: beans_app
          BEANS_DB_PASSWORD: beans_app
          BEANS_DB_NAME: beans
          BEANS_TEST_DB_NAME: beans_test

      - name: Apply migrations
        run: pnpm --filter @beans/api db:migrate:test
        env:
          TEST_DATABASE_URL: postgres://beans_app:beans_app@localhost:5432/beans_test

      - name: Test
        # Set, so the integration tests run rather than skipping. A suite that silently skips its
        # isolation tests is worse than one that fails.
        env:
          TEST_DATABASE_URL: postgres://beans_app:beans_app@localhost:5432/beans_test
        run: pnpm test

  image:
    name: Build and push image
    # The gate that matters. Two independent workflows ran these in parallel, so a commit with
    # failing tests still published `latest` — for an app holding a household's finances, publishing
    # ahead of the tests is the wrong way round.
    needs: check
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    # Twenty minutes. A normal build here is under two.
    #
    # This is the guard that was missing when an emulated arm64 `pnpm install` deadlocked and ran
    # for **five hours fifty-nine minutes** before GitHub's six-hour default killed it — silently,
    # having produced no output since the first second and no notification at any point. The build
    # was not slow. It was hung, and nothing was watching.
    timeout-minutes: 20

    permissions:
      contents: read
      # Lets the built-in token push to GHCR, so no long-lived registry credential has to exist as
      # a repository secret.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercased explicitly: the repository is `nerdspar/Beans` and GHCR rejects uppercase.
          images: ghcr.io/nerdspar/beans
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 on every push; arm64 only on a tag.
          #
          # The NAS is x86, so amd64 is the image that actually gets deployed. arm64 exists so the
          # same image runs on an Apple Silicon machine for reproducing a production problem, which
          # is worth having and is not worth building sixty times between releases.
          #
          # It is also the risky half. There is no arm64 runner here, so that leg is emulated under
          # QEMU, and emulated `pnpm install` intermittently deadlocks — it had succeeded in about
          # four minutes for weeks before hanging for six hours on an identical configuration. The
          # timeout above bounds the damage; building it less often reduces how frequently the dice
          # are rolled. Both, because either alone leaves the other failure open.
          #
          # To get an arm64 image on demand without waiting for a release, push a tag, or build it
          # locally: `docker build --platform linux/arm64 -f docker/Dockerfile .`
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
